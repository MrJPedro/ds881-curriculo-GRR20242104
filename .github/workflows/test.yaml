name: Test

# Roda em PRs para a main (gate de merge / branch protection) e sob demanda.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint estático do HTML com HTMLHint.
  # ---------------------------------------------------------------------------
  html-lint:
    name: HTML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint HTML (HTMLHint)
        run: npx --yes htmlhint "**/*.html"

  # ---------------------------------------------------------------------------
  # Sobe o nginx via Docker Compose e verifica se a página está sendo servida
  # na porta 8080 com a configuração atual.
  # ---------------------------------------------------------------------------
  serve-test:
    name: Serve Test (nginx via Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start nginx (docker compose up)
        run: docker compose up -d

      - name: Verify the page is served on :8080
        run: |
          set -euo pipefail
          # Aguarda o nginx responder com HTTP 200 (até ~30s).
          for i in $(seq 1 15); do
            code=$(curl -s -o response.html -w "%{http_code}" http://localhost:8080 || true)
            if [ "$code" = "200" ]; then
              echo "nginx respondeu 200 na tentativa $i."
              break
            fi
            echo "Tentativa $i: status '$code', aguardando..."
            sleep 2
          done

          # Asserção final: status 200 + corpo não-vazio.
          code=$(curl -s -o response.html -w "%{http_code}" http://localhost:8080)
          echo "Status HTTP final: $code"
          echo "--- Corpo da resposta ---"
          cat response.html
          echo "-------------------------"
          test "$code" = "200"
          test -s response.html

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
